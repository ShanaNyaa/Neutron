# Run from web/:  podman compose up         → dev server with hot reload on http://localhost:5173
#                 podman compose --profile prod up --build   → production build on http://localhost:8080
# Everything (Node, npm packages) lives in the containers; nothing is installed on the host.

x-env: &env
  TZ: Asia/Kuala_Lumpur
  DATA_DIR: /data
  # Host names allowed in the browser's address bar. Add your LAN name or IP to use it from your phone.
  ALLOWED_HOSTS: localhost,127.0.0.1
  # Who may sign in: Proton numbers, comma-separated, any format; empty for only the first person
  # to sign in; or "*" for anyone with a Proton Link account.
  ALLOWED_PHONES: ""
  # Encrypts everyone's Proton tokens in the data volume. Required for prod: openssl rand -base64 32
  SESSION_SECRET: ${SESSION_SECRET:-}

services:
  dev:
    image: docker.io/library/node:24-slim
    working_dir: /app/web
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment: *env
    ports:
      # Bound to this machine only: the app can unlock your car.
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app/web
      # The mobile app's Proton mappers are shared, read-only.
      - ../src:/app/src:ro
      - node_modules:/app/web/node_modules
      - data:/data

  prod:
    profiles: [prod]
    build:
      context: ..
      dockerfile: web/Containerfile
    environment: *env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  node_modules:
  # Everyone's encrypted Proton session tokens, command logs, and the pinned MQTT certificate.
  data:
